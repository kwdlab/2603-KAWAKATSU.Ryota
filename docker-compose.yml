services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wasbook
      MYSQL_USER: wasbook
      MYSQL_PASSWORD: uB6hEdVU
      MYSQL_ROOT_PASSWORD: root
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  vuln:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["sh", "-c", "if [ ! -d vendor ]; then composer install --no-dev --optimize-autoloader --no-interaction; fi && php artisan serve --host=0.0.0.0 --port=8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wasbook
      DB_USERNAME: wasbook
      DB_PASSWORD: uB6hEdVU
    volumes:
      - ./vuln:/app
    ports:
      - "8021:8000"
    depends_on:
      mysql:
        condition: service_healthy

  fixed:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: ["sh", "-c", "if [ ! -d vendor ]; then composer install --no-dev --optimize-autoloader --no-interaction; fi && php artisan serve --host=0.0.0.0 --port=8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: wasbook
      DB_USERNAME: wasbook
      DB_PASSWORD: uB6hEdVU
    volumes:
      - ./fixed:/app
    ports:
      - "8022:8000"
    depends_on:
      mysql:
        condition: service_healthy
